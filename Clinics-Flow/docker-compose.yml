# Complete JoClinicsFlows Docker Setup
# Includes: Database, Backend, Frontend, AI (Ollama), Redis, Nginx

services:
  # ==========================================
  # DATABASE
  # ==========================================
  postgres:
    image: postgres:15-alpine
    container_name: clinics-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-joclinics}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-clinic_secret_2024}
      POSTGRES_DB: ${DB_NAME:-joclinicsflows}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-joclinics}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ==========================================
  # CACHE
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: clinics-redis
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"
    restart: unless-stopped

  # ==========================================
  # AI SERVICES
  # ==========================================
  ollama:
    image: ollama/ollama:latest
    container_name: clinics-ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_NUM_PARALLEL=4
      - OLLAMA_MAX_LOADED_MODELS=2
      - OLLAMA_KEEP_ALIVE=24h
    # Uncomment for GPU support:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  ai-router:
    build:
      context: ./ai-router
      dockerfile: Dockerfile
    container_name: clinics-ai-router
    environment:
      - NODE_ENV=production
      - PORT=3000
      - OLLAMA_URL=http://ollama:11434
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - REDIS_URL=redis://redis:6379
    depends_on:
      - ollama
      - redis
    ports:
      - "3006:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==========================================
  # BACKEND API
  # ==========================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clinics-api
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgresql://${DB_USER:-joclinics}:${DB_PASSWORD:-clinic_secret_2024}@postgres:5432/${DB_NAME:-joclinicsflows}
      - REDIS_URL=redis://redis:6379
      - OLLAMA_URL=http://ollama:11434
      - AI_ROUTER_URL=http://ai-router:3000
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - JWT_SECRET=${JWT_SECRET:-default-secret-change-in-production}
      - WHATSAPP_ACCESS_TOKEN=${WHATSAPP_ACCESS_TOKEN}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      ai-router:
        condition: service_started
    ports:
      - "3001:3001"
    volumes:
      - api_logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==========================================
  # FRONTEND
  # ==========================================
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: clinics-web
    environment:
      - NEXT_PUBLIC_API_URL=http://api:3001
      - NODE_ENV=production
    depends_on:
      - api
    ports:
      - "3000:3000"
    restart: unless-stopped

  # ==========================================
  # REVERSE PROXY
  # ==========================================
  nginx:
    image: nginx:alpine
    container_name: clinics-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  api_logs:

networks:
  default:
    name: clinics-network
